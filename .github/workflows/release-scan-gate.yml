name: Release scan gate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Draft release tag to scan, such as v0.2.0. Leave empty for the newest draft."
        required: false
        type: string
      simulate:
        description: "Simulate VirusTotal verdicts. A simulated run never publishes."
        required: false
        default: false
        type: boolean

permissions: {}

concurrency:
  group: release-scan-gate
  cancel-in-progress: false

jobs:
  scan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Check the VirusTotal secret
        if: inputs.simulate != true
        env:
          VT_API_KEY: ${{ secrets.VIRUS_TOTAL_TOKEN }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "ERROR: the VIRUS_TOTAL_TOKEN secret is not set. Add it under Settings > Secrets and variables > Actions. The release stays a draft."
            echo "**Release scan gate stopped:** the \`VIRUS_TOTAL_TOKEN\` secret is not set. The release stays a draft." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Validate the release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [ -n "$RELEASE_TAG" ] && [[ ! "$RELEASE_TAG" =~ ^v[0-9]{1,4}\.[0-9]{1,4}\.[0-9]{1,4}(-[A-Za-z0-9]{1,32}(\.[A-Za-z0-9]{1,32}){0,3})?$ ]]; then
            echo "ERROR: release_tag must look like v1.2.3 or v1.2.3-label."
            exit 1
          fi

      - name: Check out the gate
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Scan the draft release
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SIMULATE: ${{ inputs.simulate }}
          VT_API_KEY: ${{ inputs.simulate != true && secrets.VIRUS_TOTAL_TOKEN || '' }}
        run: python -B tools/vt_release_gate.py
