schema_version = "1.0.0"
id = "devil_painter"
version = "0.2.1"
name = "Devil Painter"
tagline = "Layer-based texture painting inside Blender"
maintainer = "Artbyo3"
type = "add-on"
website = "https://artbyo3.github.io/DEVIL-PAINTER/"
tags = ["Paint", "3D View"]
license = ["SPDX:GPL-3.0-or-later"]
copyright = ["2026 Artbyo3", "2002-2026 Blender Authors"]
blender_version_min = "5.2.0"

[permissions]
files = "Save and load texture layers, presets, and library assets"
network = "Download optional free asset packs when you click Download"
clipboard = "Paste text into text fields with Ctrl+V"

[build]
paths_exclude_pattern = [
    ".*",
    "__pycache__/",
    "tests/",
    "tools/",
    "*.zip",
    "*.blend[1-9]",
    "*.md",
    "!README.md",
    "!SPEC.md",
    "assets/icons/*.png",
    "assets/icons/*.svg",
]
